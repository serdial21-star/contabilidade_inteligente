name: serdial21-b

services:
  storage-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "chown -R 10001:10001 /var/lib/serdial21/evidence"]
    user: "0:0"
    restart: "no"
    volumes:
      - evidence:/var/lib/serdial21/evidence
    networks:
      - backend

  redis:
    image: redis:8.2.9-alpine
    user: "999:1000"
    group_add:
      - "${SERDIAL21_SECRETS_GID:?Defina SERDIAL21_SECRETS_GID}"
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/secrets/redis_server_certificate
      - --tls-key-file
      - /run/secrets/redis_server_key
      - --tls-ca-cert-file
      - /run/secrets/redis_ca_certificate
      - --tls-auth-clients
      - "no"
      - --aclfile
      - /run/secrets/redis_acl
      - --save
      - ""
      - --appendonly
      - "no"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=64m,mode=0700,uid=999,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - redis_ca_certificate
      - redis_server_certificate
      - redis_server_key
      - redis_acl
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/run/secrets/redis_ca_certificate", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 192m
    cpus: 0.25

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    image: serdial21-b-api:${SERDIAL21_IMAGE_TAG:?Defina SERDIAL21_IMAGE_TAG}
    group_add:
      - "${SERDIAL21_SECRETS_GID:?Defina SERDIAL21_SECRETS_GID}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment: &api-environment
      SERDIAL21_ENVIRONMENT: homologation
      SERDIAL21_DEBUG: "false"
      SERDIAL21_LOG_LEVEL: INFO
      OIDC_ISSUER: ${OIDC_ISSUER:?Defina OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Defina OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Defina OIDC_JWKS_URL}
      PUBLIC_FRONTEND_URL: https://${SERDIAL21_PUBLIC_HOST:?Defina SERDIAL21_PUBLIC_HOST}
      CORS_ALLOWED_ORIGINS: https://${SERDIAL21_PUBLIC_HOST}
      TRUSTED_HOSTS: ${SERDIAL21_PUBLIC_HOST}
      EXTERNAL_HTTPS: "true"
      RATE_LIMIT_BACKEND: distributed
      RATE_LIMIT_BACKEND_CA_CERT_PATH: /run/secrets/redis_ca_certificate
      API_DOCS_ENABLED: "false"
      METRICS_ENDPOINT_ENABLED: "false"
      OBJECT_STORAGE_PATH: /var/lib/serdial21/evidence
    secrets: &api-secrets
      - database_url
      - rate_limit_backend_url
      - redis_ca_certificate
    volumes:
      - evidence:/var/lib/serdial21/evidence
    networks:
      - backend
    depends_on:
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1024m
    cpus: 1.25

  migrate:
    profiles: ["migration"]
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    image: serdial21-b-api:${SERDIAL21_IMAGE_TAG:?Defina SERDIAL21_IMAGE_TAG}
    group_add:
      - "${SERDIAL21_SECRETS_GID:?Defina SERDIAL21_SECRETS_GID}"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment: *api-environment
    secrets: *api-secrets
    networks:
      - backend

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: serdial21-b-web:${SERDIAL21_IMAGE_TAG:?Defina SERDIAL21_IMAGE_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=16m,mode=0770,uid=1000,gid=1000
      - /config:size=16m,mode=0770,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      backend:
      proxy:
        aliases:
          - serdial21-web
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

networks:
  backend:
    internal: true
  proxy:
    name: serdial21_proxy
    external: true

volumes:
  evidence:
    name: serdial21_b_evidence

secrets:
  database_url:
    file: ./secrets/database_url
  rate_limit_backend_url:
    file: ./secrets/rate_limit_backend_url
  redis_ca_certificate:
    file: ./secrets/redis_ca_certificate.pem
  redis_server_certificate:
    file: ./secrets/redis_server_certificate.pem
  redis_server_key:
    file: ./secrets/redis_server_key.pem
  redis_acl:
    file: ./secrets/redis-users.acl
