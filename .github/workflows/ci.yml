name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' pip-audit
      - run: node --test docs/integration/system_a_icms_apuracao/raicms_parser.test.js
      - run: python -m pytest tests/unit tests/integration tests/api -q
      - run: bash scripts/validate_system_a_client_management.sh
      - run: python -m pip_audit
      - run: python -c "from alembic.script import ScriptDirectory; from alembic.config import Config; assert len(ScriptDirectory.from_config(Config('alembic.ini')).get_heads()) == 1"
      - run: python scripts/verify_release_secrets.py
