[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'

[project]
name = 'serdial21'
version = '0.1.0'
description = 'Serdial21 Contabilidade Inteligente'
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
    'alembic>=1.14,<2',
    'fastapi>=0.115,<1',
    'pydantic>=2.10,<3',
    'pydantic-settings>=2.7,<3',
    'pymysql>=1.1,<2',
    'pyjwt[crypto]>=2.10,<3',
    'sqlalchemy>=2.0,<3',
    'uvicorn[standard]>=0.34,<1',
]

[project.optional-dependencies]
dev = [
    'httpx>=0.27,<1',
    'pytest>=8,<10',
]

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
addopts = '-ra'
pythonpath = ['src']
testpaths = ['tests']

